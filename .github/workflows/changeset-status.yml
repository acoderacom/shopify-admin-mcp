# Comments on pull requests whether they include a changeset. Non-blocking: changes
# like docs or tests don't need one. pull_request_target is safe here because the
# jobs only read the checked-out code and never execute it.
name: Changeset status

on:
  pull_request_target:
    branches: [main, dev]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}

jobs:
  pr-status:
    # Version Packages pull requests never contain changesets
    if: ${{ !startsWith(github.head_ref, 'changeset-release/') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      comment-body: ${{ steps.pr-status.outputs.comment-body }}
    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate pull request status
        id: pr-status
        uses: changesets/action/pr-status@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2

  pr-comment:
    needs: pr-status
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Comment on pull request
        uses: changesets/action/pr-comment@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          body: ${{ needs.pr-status.outputs.comment-body }}
